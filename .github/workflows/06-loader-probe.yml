name: 06 loader compile probe
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_CACHE_KEY: ohos-sdk-7.0-Release-linux-api26-v1
  LLVM_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz
  LLVM_SRC_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/llvm-project-23.1.1.src.tar.xz
  LLVM_SRC_SHA256: ebe9be46fe8756d58c5b198ffad0fa2a766257add81a4dc52179bfacc7888ee6
  NODE_SRC_SHA256: 4f5379796280cdaeb0c2f358fd04b6a16cc4fb7dfa83b5a8c91a9d963b435231
  LOADER_SHA256: 286616f15e4f12013988e45ad27a69b4968a9f059c8bd351e412505230577948
  LOADER_URL: https://codeload.github.com/deepseek-ai/dsh-node-addon-require-builtin/tar.gz/a58d3599a2e551d7d706d1ff796c9fd4bbaff63c

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ${{ env.SDK_CACHE_KEY }}
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build patch unzip xz-utils
      - name: Fetch inputs
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          mkdir -p "$T/llvm" "$T/inputs" "$T/node-src" "$T/addon-api"
          curl -fsSL --retry 10 --retry-all-errors "$LLVM_URL" -o "$T/llvm.tar.xz"
          tar -xJf "$T/llvm.tar.xz" -C "$T/llvm" --strip-components=1
          curl -fsSL --retry 10 --retry-all-errors "$LLVM_SRC_URL" -o "$T/inputs/llvm-src.tar.xz"
          echo "$LLVM_SRC_SHA256  $T/inputs/llvm-src.tar.xz" | sha256sum -c -
          curl -fsSL --retry 10 --retry-all-errors https://nodejs.org/dist/v24.22.1/node-v24.22.1.tar.xz -o "$T/node-src.tar.xz"
          echo "$NODE_SRC_SHA256  $T/node-src.tar.xz" | sha256sum -c -
          tar -xJf "$T/node-src.tar.xz" -C "$T/node-src" --strip-components=1
          curl -fsSL --retry 10 --retry-all-errors "$LOADER_URL" -o "$T/inputs/loader.tar.gz"
          echo "$LOADER_SHA256  $T/inputs/loader.tar.gz" | sha256sum -c -
          mkdir -p "$T/inputs/loader-root" && tar -xzf "$T/inputs/loader.tar.gz" -C "$T/inputs/loader-root" --strip-components=1
          curl -fsSL --retry 10 --retry-all-errors -o "$T/inputs/addon-api.tgz" "https://registry.npmjs.org/node-addon-api/-/node-addon-api-8.9.2.tgz"
          tar -xzf "$T/inputs/addon-api.tgz" -C "$T/addon-api"
      - name: build-runtimes.py
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          python3 runtime/ohos/node/build-runtimes.py \
            --sdk-native "$T/ohos-sdk/native" \
            --clang "$T/llvm/bin/clang" \
            --source-archive "$T/inputs/llvm-src.tar.xz" \
            --work "$T/build/runtimes-build" \
            --output "$T/build/runtimes" \
            --jobs 4
      - name: Compile loader TUs syntax-only with real runtimes
        run: |
          set -uo pipefail
          T="$RUNNER_TEMP"
          SDK="$T/ohos-sdk/native"
          LLVM="$T/llvm"
          R="$T/build/runtimes"
          SRC="$T/inputs/loader-root/packages/native"
          python3 - "$SRC" > "$T/sources.txt" <<'PY'
          import json, sys, pathlib
          native = pathlib.Path(sys.argv[1])
          binding = json.loads((native / 'binding.gyp').read_text())['targets'][0]
          names = list(binding['sources']) + list(binding['conditions'][0][2]['sources'])
          for name in names:
              path = native / name
              print(path if path.exists() else 'MISSING ' + str(path), file=sys.stderr if not path.exists() else sys.stdout)
          PY
          echo "===== sources"
          cat "$T/sources.txt"
          mapfile -t FILES < "$T/sources.txt"
          set +e
          "$LLVM/bin/clang++" --target=aarch64-linux-ohos --sysroot="$SDK/sysroot" \
            -resource-dir="$R/clang-resource" -stdlib++-isystem"$R/include/c++/v1" -D__MUSL__=1 \
            -std=c++17 -O2 -g0 -fPIC -shared -pthread -stdlib=libc++ -fvisibility=hidden -fno-exceptions \
            -include "$GITHUB_WORKSPACE/runtime/ohos/node/napi-rename.h" \
            -DNAPI_VERSION=9 -DNARB_BACKEND=1 -DNARB_PRODUCT=1 \
            -DNODE_ADDON_API_DISABLE_CPP_EXCEPTIONS -DNODE_GYP_MODULE_NAME=require_builtin \
            -ffile-prefix-map="$T/inputs/loader-root=node-addon-require-builtin-0.1.9" \
            -I "$T/node-src/src" -I "$T/addon-api/package" \
            "${FILES[@]}" \
            -L "$T/out" -Wl,-rpath-link,"$T/out" -lnode -ldl \
            -L "$R/lib" --ld-path="$SDK/llvm/bin/ld.lld" -static-libstdc++ \
            -Wl,--exclude-libs,ALL -Wl,-z,defs -Wl,-soname,require_builtin.node \
            -fsyntax-only 2>&1 | tee "$T/probe.log"
          rc=${PIPESTATUS[0]}
          echo "syntax-probe rc=$rc"
          echo "===== errors"
          grep -E "error:" "$T/probe.log" | head -n 40 || true

      - name: Link without libnode to isolate toolchain libs
        run: |
          set -uo pipefail
          T="$RUNNER_TEMP"
          SDK="$T/ohos-sdk/native"
          LLVM="$T/llvm"
          R="$T/build/runtimes"
          mapfile -t FILES < "$T/sources.txt"
          set +e
          "$LLVM/bin/clang++" --target=aarch64-linux-ohos --sysroot="$SDK/sysroot" \
            -resource-dir="$R/clang-resource" -stdlib++-isystem"$R/include/c++/v1" -D__MUSL__=1 \
            -std=c++17 -O2 -g0 -fPIC -shared -pthread -stdlib=libc++ -fvisibility=hidden -fno-exceptions \
            -include "$GITHUB_WORKSPACE/runtime/ohos/node/napi-rename.h" \
            -DNAPI_VERSION=9 -DNARB_BACKEND=1 -DNARB_PRODUCT=1 \
            -DNODE_ADDON_API_DISABLE_CPP_EXCEPTIONS -DNODE_GYP_MODULE_NAME=require_builtin \
            -I "$T/node-src/src" -I "$T/addon-api/package" \
            "${FILES[@]}" -ldl \
            -L "$R/lib" --ld-path="$SDK/llvm/bin/ld.lld" -static-libstdc++ \
            -Wl,--exclude-libs,ALL -Wl,-soname,require_builtin.node \
            -o "$T/nolibnode.so" 2>&1 | tail -n 60
          echo "link-without-libnode rc=$?"
          ls -l "$T/nolibnode.so" 2>/dev/null || true
